# claudelint configuration
# https://github.com/stbenjam/claudelint

strict: true

rules:
  # Plugin structure
  plugin-json-required:
    enabled: true
    severity: error

  plugin-json-valid:
    enabled: true
    severity: error

  plugin-naming:
    enabled: true
    severity: warning

  plugin-readme:
    enabled: false

  # Commands (disabled - this marketplace uses skills only)
  commands-dir-required:
    enabled: false

  commands-exist:
    enabled: false

  # Marketplace
  marketplace-json-valid:
    enabled: auto
    severity: error

  marketplace-registration:
    enabled: auto
    severity: error

  # Skills
  skill-frontmatter:
    enabled: true
    severity: warning

  # Agents
  agent-frontmatter:
    enabled: true
    severity: error

  # Hooks
  hooks-json-valid:
    enabled: true
    severity: error

  # MCP
  mcp-valid-json:
    enabled: true
    severity: error

exclude:
  - "**/node_modules/**"
  - "**/.git/**"
